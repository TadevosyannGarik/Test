<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Meridian — ИС управления проектами</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#fafafa" />
        <meta
            name="description"
            content="Информационная система управления курсовыми и дипломными работами на основе нечёткой логики Мамдани"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/app.css" />
        <link rel="stylesheet" href="css/auth.css" />
        <link rel="stylesheet" href="css/student.css" />
        <link rel="stylesheet" href="css/teacher.css" />
        <link rel="stylesheet" href="css/admin.css" />
        <link rel="stylesheet" href="css/extras.css" />
        <link rel="stylesheet" href="css/mamdani.css" />
        <link rel="stylesheet" href="css/simulate.css" />
        <link rel="stylesheet" href="css/mf-editor.css" />
        <link rel="stylesheet" href="css/docx.css" />
        <link rel="stylesheet" href="css/notifications.css" />
        <link rel="stylesheet" href="css/charts.css" />
        <link rel="stylesheet" href="css/profile.css" />
        <link rel="stylesheet" href="css/demo-live.css" />
        <link rel="stylesheet" href="css/overrides.css" />
    </head>
    <body>
        <svg
            class="bg-filter"
            aria-hidden="true"
            width="0"
            height="0"
            style="position: absolute; width: 0; height: 0"
        >
            <defs>
                <filter
                    id="blobShape"
                    x="-50%"
                    y="-50%"
                    width="200%"
                    height="200%"
                >
                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.015"
                        numOctaves="2"
                        seed="5"
                        result="noise"
                    >
                        <animate
                            attributeName="baseFrequency"
                            dur="40s"
                            values="0.015;0.022;0.012;0.018;0.015"
                            repeatCount="indefinite"
                        />
                    </feTurbulence>
                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="noise"
                        scale="70"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />
                </filter>
            </defs>
        </svg>

        <div class="bg-blobs" aria-hidden="true">
            <div class="bg-blob bg-blob-a">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="bg-blob bg-blob-b">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="bg-blob bg-blob-c">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="bg-blob bg-blob-d">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="bg-blob bg-blob-e">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
        <noscript>
            <div
                style="
                    padding: 40px;
                    text-align: center;
                    font-family: system-ui, sans-serif;
                "
            >
                <h2>Meridian</h2>
                <p>Для работы приложения требуется JavaScript.</p>
            </div>
        </noscript>

        <div id="authScreen" class="auth-screen">
            <div class="auth-card">
                <div class="auth-brand">
                    <span class="brand-mark">M</span>
                    <span class="brand-name">Meridian</span>
                </div>
                <div class="auth-sub">
                    Управление курсовыми и дипломными работами
                </div>

                <div class="auth-tabs">
                    <button
                        id="tabLogin"
                        class="active"
                        data-mode="login"
                        type="button"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            class="icon icon-sm"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                            />
                            <polyline points="10 17 15 12 10 7" />
                            <line x1="15" y1="12" x2="3" y2="12" />
                        </svg>
                        <span>Вход</span>
                    </button>
                    <button id="tabRegister" data-mode="register" type="button">
                        <svg
                            viewBox="0 0 24 24"
                            class="icon icon-sm"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
                            />
                            <circle cx="9" cy="7" r="4" />
                            <line x1="19" y1="8" x2="19" y2="14" />
                            <line x1="22" y1="11" x2="16" y2="11" />
                        </svg>
                        <span>Регистрация</span>
                    </button>
                </div>

                <div id="authMsg" class="auth-msg"></div>

                <form
                    id="loginForm"
                    class="auth-form"
                    onsubmit="
                        event.preventDefault();
                        Auth.login();
                    "
                >
                    <div class="field">
                        <label>Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                        />
                        <div class="field-err">Введите корректный email</div>
                    </div>

                    <div class="field">
                        <label>Пароль</label>
                        <input
                            type="password"
                            id="loginPass"
                            placeholder="••••••••"
                            autocomplete="current-password"
                        />
                        <div class="field-err">Пароль обязателен</div>
                    </div>

                    <button
                        type="submit"
                        class="btn-primary"
                        style="width: 100%"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            class="icon icon-sm"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                            />
                            <polyline points="10 17 15 12 10 7" />
                            <line x1="15" y1="12" x2="3" y2="12" />
                        </svg>
                        <span>Войти</span>
                    </button>

                    <div class="demo-hint">
                        <div class="demo-title">
                            Демо-аккаунты · пароль <b>123456</b>
                        </div>
                        <div class="demo-buttons">
                            <button
                                type="button"
                                class="demo-btn"
                                onclick="Auth.fillDemo('student')"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    class="icon icon-sm"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.75"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                                </svg>
                                <span>Студент</span>
                            </button>
                            <button
                                type="button"
                                class="demo-btn"
                                onclick="Auth.fillDemo('teacher')"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    class="icon icon-sm"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.75"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path
                                        d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"
                                    />
                                    <circle cx="9" cy="7" r="4" />
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                                </svg>
                                <span>Преподаватель</span>
                            </button>
                            <button
                                type="button"
                                class="demo-btn"
                                onclick="Auth.fillDemo('admin')"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    class="icon icon-sm"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.75"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path
                                        d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                                    />
                                </svg>
                                <span>Администратор</span>
                            </button>
                        </div>
                    </div>
                </form>

                <form
                    id="registerForm"
                    class="auth-form"
                    style="display: none"
                    onsubmit="
                        event.preventDefault();
                        Auth.register();
                    "
                >
                    <div class="section-label">Роль</div>
                    <div class="role-picker">
                        <button
                            type="button"
                            data-role="student"
                            class="active"
                            onclick="Auth.pickRole('student')"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                class="icon icon-xl"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                <path d="M6 12v5c3 3 9 3 12 0v-5" />
                            </svg>
                            <span class="role-lbl">Студент</span>
                        </button>
                        <button
                            type="button"
                            data-role="teacher"
                            onclick="Auth.pickRole('teacher')"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                class="icon icon-xl"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"
                                />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            <span class="role-lbl">Преподаватель</span>
                        </button>
                        <button
                            type="button"
                            data-role="admin"
                            onclick="Auth.pickRole('admin')"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                class="icon icon-xl"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                                />
                            </svg>
                            <span class="role-lbl">Администратор</span>
                        </button>
                    </div>

                    <div class="section-label">Основные данные</div>

                    <div class="field">
                        <label>ФИО <span class="req">*</span></label>
                        <input
                            type="text"
                            id="regFio"
                            placeholder="Иванов Иван Иванович"
                            autocomplete="name"
                        />
                        <div class="field-err">Укажите ФИО</div>
                    </div>

                    <div class="field">
                        <label>Email <span class="req">*</span></label>
                        <input
                            type="email"
                            id="regEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                        />
                        <div class="field-err">Введите корректный email</div>
                    </div>

                    <div class="row-2">
                        <div class="field">
                            <label>Пароль <span class="req">*</span></label>
                            <input
                                type="password"
                                id="regPass"
                                placeholder="мин. 6 символов"
                                autocomplete="new-password"
                            />
                            <div class="field-err">Минимум 6 символов</div>
                        </div>
                        <div class="field">
                            <label
                                >Повтор пароля <span class="req">*</span></label
                            >
                            <input
                                type="password"
                                id="regPass2"
                                placeholder="повторите"
                                autocomplete="new-password"
                            />
                            <div class="field-err">Пароли не совпадают</div>
                        </div>
                    </div>

                    <div class="section-label" id="roleSectionLabel">
                        Данные студента
                    </div>
                    <div id="roleFields"></div>

                    <button
                        type="submit"
                        class="btn-primary"
                        style="width: 100%; margin-top: 8px"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            class="icon icon-sm"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
                            />
                            <circle cx="9" cy="7" r="4" />
                            <line x1="19" y1="8" x2="19" y2="14" />
                            <line x1="22" y1="11" x2="16" y2="11" />
                        </svg>
                        <span>Создать аккаунт</span>
                    </button>
                </form>
            </div>
        </div>

        <div id="app" class="app" style="display: none">
            <header class="app-header">
                <div class="app-brand">
                    <span class="brand-mark">FP</span>
                    <span class="brand-name">Meridian</span>
                </div>

                <div class="app-user">
                    <div class="notif-wrap" style="position: relative">
                        <div
                            class="notif-bell"
                            id="notifBell"
                            onclick="Notifications.toggle()"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                class="icon icon-lg"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.75"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
                                />
                                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                            </svg>
                            <span
                                class="notif-count"
                                id="notifCount"
                                style="display: none"
                                >0</span
                            >
                        </div>
                    </div>

                    <div class="app-user-info">
                        <div class="app-user-name" id="hUserName">—</div>
                        <div class="app-user-role" id="hUserRole">—</div>
                    </div>

                    <div
                        class="app-avatar"
                        id="hAvatar"
                        onclick="App.navigate('profile')"
                        title="Профиль"
                    >
                        ?
                    </div>

                    <button class="btn-ghost btn-sm" onclick="Auth.logout()">
                        <svg
                            viewBox="0 0 24 24"
                            class="icon icon-sm"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                        <span>Выйти</span>
                    </button>
                </div>
            </header>

            <nav class="app-nav" id="mainNav"></nav>

            <main class="app-main">
                <div id="viewRoot"></div>
            </main>
        </div>

        <div id="toast" class="toast"></div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

        <script src="js/storage.js"></script>
        <script src="js/utils.js"></script>

        <script src="js/icons-svg.js"></script>
        <script src="js/fuzzy.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/notifications.js"></script>
        <script src="js/announcements.js"></script>
        <script src="js/charts.js"></script>
        <script src="js/audit.js"></script>
        <script src="js/consult.js"></script>

        <script src="js/mamdani-viz.js"></script>
        <script src="js/mf-editor.js"></script>
        <script src="js/simulate.js"></script>

        <script src="js/docx-check.js"></script>
        <script src="js/pdf-report.js"></script>
        <script src="js/ranking.js"></script>

        <script src="js/student.js"></script>
        <script src="js/teacher.js"></script>
        <script src="js/admin.js"></script>

        <script src="js/demo-data.js"></script>
        <script src="js/demo-student-live.js"></script>

        <script src="js/app.js"></script>
    </body>
</html>
